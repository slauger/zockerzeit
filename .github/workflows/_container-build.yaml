name: Container Build

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name (without registry prefix)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Containerfile'
        required: true
        type: string
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push:
        description: 'Push images regardless of branch'
        required: false
        type: boolean
        default: false
      image_tag:
        description: 'Custom image tag (default: short git SHA or version tag)'
        required: false
        type: string
        default: ''
      latest:
        description: 'Also tag the image as :latest'
        required: false
        type: boolean
        default: false
      sign:
        description: 'Sign images with cosign keyless signing'
        required: false
        type: boolean
        default: true
    outputs:
      version:
        description: 'Image version tag'
        value: ${{ jobs.prepare.outputs.version }}
      image:
        description: 'Full image reference'
        value: ${{ jobs.manifest.outputs.image }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Determine version
        id: version
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "${IMAGE_TAG}" ]]; then
            echo "version=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build platform matrix
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          MATRIX='{"include":['
          FIRST=true
          for PLATFORM in ${PLATFORMS//,/ }; do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              MATRIX="${MATRIX},"
            fi
            case "${PLATFORM}" in
              linux/amd64) RUNNER="ubuntu-latest" ;;
              linux/arm64) RUNNER="ubuntu-24.04-arm" ;;
              *)           RUNNER="ubuntu-latest" ;;
            esac
            MATRIX="${MATRIX}{\"platform\":\"${PLATFORM}\",\"runner\":\"${RUNNER}\"}"
          done
          MATRIX="${MATRIX}]}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile }}

  build:
    needs: [hadolint, prepare]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set platform suffix
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "suffix=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Each architecture builds in its own job, so the stamp is taken per job.
      # It records when the image was built, which is what
      # org.opencontainers.image.created means, not the commit date.
      - name: Determine build date
        id: build-date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push }}
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ needs.prepare.outputs.version }}-${{ steps.platform.outputs.suffix }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}-${{ matrix.platform }}

  manifest:
    if: inputs.push
    needs: [prepare, build]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.result.outputs.image }}
    permissions:
      packages: write
      id-token: write
      # Required by actions/attest-build-provenance, which was already
      # granted at the workflow level but never actually invoked.
      attestations: write
      contents: read
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@v4.1.4

      - name: Create and push manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          LATEST: ${{ inputs.latest }}
        run: |
          SOURCES=()
          for PLATFORM in ${PLATFORMS//,/ }; do
            SOURCES+=("${IMAGE}:${VERSION}-${PLATFORM//\//-}")
          done

          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${SOURCES[@]}"

          if [[ "${LATEST}" == "true" ]]; then
            docker buildx imagetools create -t "${IMAGE}:latest" "${SOURCES[@]}"
          fi

      - name: Resolve manifest digests
        id: digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r '.digest'
          }

          VERSION_DIGEST=$(digest_of "${IMAGE}:${VERSION}")
          DIGESTS="${VERSION_DIGEST}"

          # :latest is built from the same per-arch sources, so it normally
          # resolves to the identical index digest and one signature covers
          # both tags. Compare rather than assume, and sign both if they ever
          # diverge.
          if [[ "${LATEST}" == "true" ]]; then
            LATEST_DIGEST=$(digest_of "${IMAGE}:latest")
            if [[ "${LATEST_DIGEST}" != "${VERSION_DIGEST}" ]]; then
              echo "::warning::latest and ${VERSION} resolved to different digests, signing both"
              DIGESTS="${DIGESTS} ${LATEST_DIGEST}"
            fi
          fi

          {
            echo "image=${IMAGE}"
            echo "version-digest=${VERSION_DIGEST}"
            echo "all=${DIGESTS}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign (keyless)
        if: inputs.sign
        env:
          IMAGE: ${{ steps.digests.outputs.image }}
          DIGESTS: ${{ steps.digests.outputs.all }}
        run: |
          for DIGEST in ${DIGESTS}; do
            cosign sign --yes "${IMAGE}@${DIGEST}"
          done

      - name: Attest build provenance
        if: inputs.sign
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.digests.outputs.image }}
          subject-digest: ${{ steps.digests.outputs.version-digest }}
          push-to-registry: true

      - name: Set output
        id: result
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "image=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
