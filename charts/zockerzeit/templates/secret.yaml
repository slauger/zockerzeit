{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zockerzeit.fullname" . }}
  labels:
    {{- include "zockerzeit.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secret }}
  {{- if .adminPassword }}
  ZOCKERZEIT_ADMIN_PASSWORD: {{ .adminPassword | quote }}
  {{- end }}
  {{- if .sessionSecret }}
  ZOCKERZEIT_SESSION_SECRET: {{ .sessionSecret | quote }}
  {{- end }}
  {{- if .ntfyToken }}
  ZOCKERZEIT_NTFY_TOKEN: {{ .ntfyToken | quote }}
  {{- end }}
  {{- end }}
{{- end }}
