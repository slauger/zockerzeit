# Zockerzeit configuration. Copy to config.yaml and adjust.
# Secrets are better passed as environment variables:
#   ZOCKERZEIT_ADMIN_PASSWORD, ZOCKERZEIT_SESSION_SECRET, ZOCKERZEIT_NTFY_TOKEN

listen: ":8080"
database: zockerzeit.db
timezone: Europe/Berlin

# Notify when a playing kid has this many minutes left.
warnMinutes: [10, 5]

notify:
  # Optional ntfy topic URL, e.g. https://ntfy.sh/<random-topic> or a
  # self-hosted instance. More channels (ntfy, Telegram) can be added in the
  # web UI under Einstellungen.
  ntfyURL: ""
